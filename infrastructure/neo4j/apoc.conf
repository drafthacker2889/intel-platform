# Allow only the APOC procedures actually needed for data import/export.
# Do NOT use apoc.* (unrestricted) as that allows arbitrary file and code access.
apoc.import.file.enabled=true
apoc.export.file.enabled=true
apoc.import.file.use_neo4j_config=true

dbms.security.procedures.unrestricted=apoc.graph.*,apoc.convert.*,apoc.coll.*,apoc.map.*

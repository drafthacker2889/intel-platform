cluster.name: "docker-cluster"
network.host: 0.0.0.0

# --- MEMORY & PERFORMANCE ---
bootstrap.memory_lock: true

# --- DISCOVERY ---
discovery.type: single-node

# --- SECURITY ---
# xpack.security is enabled in prod via docker-compose.prod.yml environment override.
# Dev-only: leave security disabled but NEVER use this config in production.
xpack.security.enabled: false
xpack.security.enrollment.enabled: false

# --- HTTP SETTINGS ---
# CORS is disabled; the Nginx gateway is the only entry point.
http.cors.enabled: false

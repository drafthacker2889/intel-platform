# Nginx load balancer for multi-instance crawler
# Routes health checks and metrics across collector-python instances

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream group: all collector-python instances
    upstream collector_instances {
        least_conn;  # Load balancing strategy: least connections
        server collector-python:8081 max_fails=3 fail_timeout=30s;
    }

    # Upstream group for brain-python
    upstream brain_instance {
        server brain-python:8082;
    }

    # Elasticsearch
    upstream elasticsearch_instance {
        server elasticsearch:9200;
    }

    # Neo4j
    upstream neo4j_instance {
        server neo4j:7474;
    }

    # Kibana
    upstream kibana_instance {
        server kibana:5601;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Health check endpoint (aggregates status from all collectors)
        location /health {
            access_log off;
            proxy_pass http://collector_instances;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        # Metrics endpoint (aggregated from all collectors)
        location /metrics {
            access_log off;
            proxy_pass http://collector_instances;
            proxy_read_timeout 5s;
        }

        # Brain health
        location /brain/health {
            access_log off;
            proxy_pass http://brain_instance/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        # Elasticsearch proxy
        location /es/ {
            proxy_pass http://elasticsearch_instance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Neo4j proxy
        location /neo4j/ {
            proxy_pass http://neo4j_instance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Kibana proxy
        location /kibana/ {
            proxy_pass http://kibana_instance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Status page
        location /status {
            access_log off;
            default_type text/html;
            return 200 '<html><body><h1>Intel Platform Load Balancer</h1><p>OK</p></body></html>';
        }

        # Default endpoint
        location / {
            access_log off;
            default_type text/plain;
            return 200 'Intel Platform Crawler Orchestration\n';
        }
    }
}

x-restart-policy: &default-restart
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: intel_elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.authc.api_key.enabled=true
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
      - cluster.routing.allocation.disk.threshold_enabled=false
      - cluster.routing.allocation.disk.watermark.low=99%
      - cluster.routing.allocation.disk.watermark.high=99%
      - cluster.routing.allocation.disk.watermark.flood_stage=99%
    volumes:
      - ./es_data:/usr/share/elasticsearch/data
      - ./infrastructure/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"
    networks:
      - intel_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s
    mem_limit: 1g
    cpus: "1.0"
    <<: [*default-restart, *default-logging]

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    container_name: intel_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - intel_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q 'available'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    cpus: "0.5"
    <<: [*default-restart, *default-logging]

  neo4j:
    image: neo4j:4.4
    container_name: intel_graph
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=1g
    volumes:
      - ./neo4j_data:/data
      - ./infrastructure/neo4j/apoc.conf:/var/lib/neo4j/conf/apoc.conf:ro
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - intel_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 25s
      timeout: 10s
      retries: 8
      start_period: 40s
    mem_limit: 1500m
    cpus: "1.0"
    <<: [*default-restart, *default-logging]

  redis:
    image: redis:7-alpine
    container_name: intel_queue
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - intel_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 256m
    cpus: "0.25"
    <<: [*default-restart, *default-logging]

  tor-proxy:
    image: dperson/torproxy
    container_name: intel_tor
    ports:
      - "9050:9050"
      - "9051:9051"
    volumes:
      - ./infrastructure/tor/torrc:/etc/tor/torrc:ro
    networks:
      - intel_net
    healthcheck:
      test: ["CMD-SHELL", "echo -e 'AUTHENTICATE \"\"\r\nSIGNAL NEWNYM\r\nQUIT' | nc -w 3 localhost 9051 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 128m
    cpus: "0.25"
    <<: [*default-restart, *default-logging]

  collector-go:
    build:
      context: ./services/collector-go
    container_name: intel_collector
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TOR_PROXY=socks5://tor-proxy:9050
      - START_URL=${START_URL:-https://www.torproject.org}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-www.torproject.org,support.torproject.org,community.torproject.org}
      - RAW_QUEUE_NAME=${RAW_QUEUE_NAME:-raw_html}
      - RAW_DLQ_QUEUE=${RAW_DLQ_QUEUE:-raw_html_dlq}
      - MAX_PAGES=${MAX_PAGES:-250}
      - HEALTH_PORT=8081
    depends_on:
      redis:
        condition: service_healthy
      tor-proxy:
        condition: service_healthy
    networks:
      - intel_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: "0.5"
    <<: [*default-restart, *default-logging]

  sanitizer-rust:
    build:
      context: ./services/sanitizer-rust
    container_name: intel_sanitizer
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/
      - RAW_QUEUE_NAME=${RAW_QUEUE_NAME:-raw_html}
      - RAW_DLQ_QUEUE=${RAW_DLQ_QUEUE:-raw_html_dlq}
      - SANITIZED_QUEUE_NAME=${SANITIZED_QUEUE_NAME:-sanitized_text}
      - SANITIZED_DLQ_QUEUE=${SANITIZED_DLQ_QUEUE:-sanitized_text_dlq}
      - MIN_TEXT_LEN=${MIN_TEXT_LEN:-80}
      - HEALTH_PORT=8083
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - intel_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: "0.5"
    <<: [*default-restart, *default-logging]

  collector-python:
    build:
      context: ./services/collector-python
    container_name: intel_collector_py
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TOR_PROXY=socks5://tor-proxy:9050
      - CRAWL_URL_QUEUE=${RAW_QUEUE_NAME:-raw_html}
      - START_URL=${START_URL:-https://www.torproject.org}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-www.torproject.org,support.torproject.org,community.torproject.org}
      - SANITIZED_QUEUE_NAME=${SANITIZED_QUEUE_NAME:-sanitized_text}
      - PLAYWRIGHT_TIMEOUT_MS=30000
      - CAPTCHA_SOLVER_ENABLED=${CAPTCHA_SOLVER_ENABLED:-true}
      - CAPTCHA_2_KEY=${CAPTCHA_2_KEY}
      - HEALTH_PORT=8081
    depends_on:
      redis:
        condition: service_healthy
      tor-proxy:
        condition: service_healthy
    networks:
      - intel_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    cpus: "1.0"
    <<: [*default-restart, *default-logging]

  brain-python:
    build:
      context: ./services/brain-python
    container_name: intel_brain
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ELASTIC_HOST=http://elasticsearch:9200
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - SANITIZED_QUEUE_NAME=${SANITIZED_QUEUE_NAME:-sanitized_text}
      - SANITIZED_DLQ_QUEUE=${SANITIZED_DLQ_QUEUE:-sanitized_text_dlq}
      - ELASTIC_INDEX=${ELASTIC_INDEX:-intel-data-v3}
      - SCHEMA_VERSION=${SCHEMA_VERSION:-v1}
      - MODEL_VERSION=${MODEL_VERSION:-risk-ml-v1}
      - SCORING_STRATEGY=${SCORING_STRATEGY:-auto}
      - RISK_MODEL_PATH=${RISK_MODEL_PATH:-/app/models/risk_model.joblib}
      - HEALTH_PORT=8082
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - intel_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    cpus: "1.0"
    <<: [*default-restart, *default-logging]

  dashboard-ui:
    build:
      context: ./services/dashboard-ui
    container_name: intel_dashboard
    ports:
      - "3000:80"
    depends_on:
      brain-python:
        condition: service_healthy
    networks:
      - intel_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: "0.25"
    <<: [*default-restart, *default-logging]

  postgres:
    image: postgres:15-alpine
    container_name: intel_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-intel_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-intel_dedup}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres_dedup.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ports:
      - "5432:5432"
    networks:
      - intel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intel_user} -d ${POSTGRES_DB:-intel_dedup}"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 512m
    cpus: "0.5"
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
    <<: [*default-restart, *default-logging]

networks:
  intel_net:
    driver: bridge

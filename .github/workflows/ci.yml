name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  collector-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/collector-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/collector-go
      - name: Test
        run: go test ./...

  sanitizer-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sanitizer-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/sanitizer-rust
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  brain-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/brain-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/brain-python/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: |
          pip install pylint mypy
          pylint src/main.py --disable=C,R || true
          mypy src/main.py --ignore-missing-imports
      - name: Unit tests
        run: python -m unittest discover -s src -p "test_*.py"
      - name: Risk model evaluation
        run: python eval_model.py
      - name: Train ML risk model
        run: python train_risk_model.py

  auth-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/auth-api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: |
          pip install pylint mypy
          pylint src/main.py --disable=C,R || true
          mypy src/main.py --ignore-missing-imports
      - name: Unit tests
        run: python -m unittest discover -s src -p "test_*.py"

  dashboard-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/dashboard-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  trivy-scan:
    runs-on: ubuntu-latest
    needs: [collector-go, sanitizer-rust, brain-python, auth-api, dashboard-ui]
    strategy:
      matrix:
        service: [collector-go, sanitizer-rust, brain-python, auth-api, dashboard-ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t intel-${{ matrix.service }}:ci services/${{ matrix.service }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: intel-${{ matrix.service }}:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

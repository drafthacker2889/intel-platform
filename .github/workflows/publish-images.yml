name: Publish container images

# Builds each service image and pushes it to the GitHub Container Registry
# (ghcr.io), so the images appear under the repository's Packages section.
# Runs on a version tag or on manual dispatch. Uses the built-in GITHUB_TOKEN,
# so no secrets need to be configured.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [collector-go, sanitizer-rust, brain-python, auth-api, dashboard-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: name
        run: echo "repo=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.name.outputs.repo }}/intel-${{ matrix.service }}:latest
            ghcr.io/${{ steps.name.outputs.repo }}/intel-${{ matrix.service }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

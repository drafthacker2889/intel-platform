services:
  tempo:
    image: grafana/tempo:2.6.1
    container_name: intel_tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infrastructure/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/lib/tempo
    ports:
      - "3200:3200"
    networks:
      - intel_net
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: intel_otel_collector
    command: ["--config=/etc/otelcol/collector.conf"]
    volumes:
      - ./infrastructure/otel/collector.conf:/etc/otelcol/collector.conf:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
    networks:
      - intel_net
    mem_limit: 256m
    cpus: "0.25"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: intel_prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    networks:
      - intel_net
    mem_limit: 256m
    cpus: "0.25"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: intel_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-REPLACE_WITH_STRONG_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - intel_net
    mem_limit: 256m
    cpus: "0.25"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  collector-go:
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=collector-go

  brain-python:
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=brain-python

networks:
  intel_net:
    driver: bridge

volumes:
  tempo_data:
    driver: local
  grafana_data:
    driver: local
